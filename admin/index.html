<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Mi Tienda</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #080808;
            color: #e5e5e5;
        }
        /* Estilo consistente con el frontend */
        .card-panel {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            transition: all 0.2s;
        }
        .btn-primary {
            background-color: #3b82f6;
            transition: all 0.2s;
        }
        .btn-primary:hover {
            background-color: #2563eb;
            transform: translateY(-1px);
        }
        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s;
        }
        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        .tab-btn {
            transition: all 0.2s;
            border-radius: 0.75rem 0.75rem 0 0;
            padding: 0.5rem 1.5rem;
            font-weight: 500;
        }
        .tab-btn.active {
            background-color: #3b82f6;
            color: white;
        }
        .tab-btn:not(.active) {
            background-color: transparent;
            color: #9ca3af;
            border-bottom: 1px solid transparent;
        }
        .tab-btn:not(.active):hover {
            color: white;
            background-color: rgba(59, 130, 246, 0.2);
        }
        .estado-pendiente {
            background-color: #eab308;
            color: #1e1e1e;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .estado-enviado {
            background-color: #22c55e;
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .estado-cancelado {
            background-color: #ef4444;
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        /* Modal estilo consistente */
        .modal-content {
            background: #0f0f0f;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
            backdrop-filter: blur(8px);
        }
        input, select {
            background-color: #0a0a0a;
            border: 1px solid #2a2a2a;
            border-radius: 0.75rem;
            padding: 0.5rem 1rem;
            color: white;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #3b82f6;
        }
    </style>
</head>
<body class="p-6 antialiased">
    <div class="max-w-6xl mx-auto">
        <!-- Header con logo y título igual al frontend -->
        <div class="flex justify-between items-center mb-8 border-b border-white/10 pb-4">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600/20 p-2 rounded-xl">
                    <i class="fa-regular fa-rectangle-list text-blue-400 text-xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-light tracking-wide text-white">MI TIENDA</h1>
                    <p class="text-[10px] uppercase tracking-[0.2em] text-gray-400">Panel de Administración</p>
                </div>
            </div>
            <button id="logoutBtn" class="bg-red-600/80 hover:bg-red-600 px-4 py-2 rounded-full text-sm font-medium transition-all">
                <i class="fa-regular fa-door-open mr-2"></i>Cerrar Sesión
            </button>
        </div>

        <!-- Tabs elegantes -->
        <div class="flex gap-1 border-b border-white/10 mb-8">
            <button id="tabProductos" class="tab-btn active bg-blue-600 text-white px-5 py-2">Productos</button>
            <button id="tabPedidos" class="tab-btn px-5 py-2">Pedidos</button>
        </div>

        <!-- Panel Productos -->
        <div id="productosPanel" class="card-panel">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-light tracking-wide flex items-center gap-2">
                    <i class="fa-regular fa-box text-blue-400"></i> Gestión de Productos
                </h2>
                <button id="nuevoProductoBtn" class="btn-primary px-4 py-2 rounded-full text-sm font-medium flex items-center gap-2">
                    <i class="fa-regular fa-plus"></i> Nuevo Producto
                </button>
            </div>
            <div id="listaProductos" class="grid grid-cols-1 gap-3">
                <p class="text-gray-400 text-center py-8">Cargando productos...</p>
            </div>
        </div>

        <!-- Panel Pedidos -->
        <div id="pedidosPanel" class="card-panel hidden">
            <h2 class="text-xl font-light tracking-wide mb-6 flex items-center gap-2">
                <i class="fa-regular fa-clipboard-list text-blue-400"></i> Gestión de Pedidos
            </h2>
            <div id="listaPedidos" class="space-y-4">
                <p class="text-gray-400 text-center py-8">Cargando pedidos...</p>
            </div>
        </div>
    </div>

    <!-- Modal Producto -->
    <div id="productoModal" class="fixed inset-0 bg-black/70 flex items-center justify-center hidden z-50 backdrop-blur-sm">
        <div class="modal-content w-full max-w-md p-6">
            <h3 id="modalTitle" class="text-xl font-light mb-4">Nuevo Producto</h3>
            <input type="hidden" id="editProductId">
            <div class="space-y-4">
                <input type="text" id="prodCodigo" placeholder="Código único (ej: zap-urbana-01)" class="w-full">
                <input type="text" id="prodTitulo" placeholder="Nombre del producto" class="w-full">
                <input type="text" id="prodPrecio" placeholder="Precio (ARS)" class="w-full">
                <input type="text" id="prodImagen" placeholder="URL de la imagen" class="w-full">
                <input type="text" id="prodTalles" placeholder="Talles (ej: 38,39,40)" class="w-full">
                <input type="text" id="prodColores" placeholder="Colores (ej: Negro, Blanco)" class="w-full">
                <select id="prodCategoria" class="w-full">
                    <option value="urbano">Urbano</option>
                    <option value="deportivo">Deportivo</option>
                    <option value="casual">Casual</option>
                </select>
            </div>
            <div class="flex justify-end gap-3 mt-6">
                <button id="cancelModalBtn" class="btn-secondary px-4 py-2 rounded-full text-sm">Cancelar</button>
                <button id="saveProductBtn" class="btn-primary px-4 py-2 rounded-full text-sm">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal Pedido -->
    <div id="pedidoModal" class="fixed inset-0 bg-black/70 flex items-center justify-center hidden z-50 backdrop-blur-sm">
        <div class="modal-content w-full max-w-lg p-6">
            <h3 class="text-xl font-light mb-4">Detalle del Pedido</h3>
            <div id="detallePedido" class="space-y-3 text-sm max-h-96 overflow-y-auto"></div>
            <div class="mt-4">
                <label class="block text-xs text-gray-400 mb-1">Cambiar estado:</label>
                <select id="estadoPedidoSelect" class="w-full">
                    <option value="pendiente">Pendiente</option>
                    <option value="enviado">Enviado</option>
                    <option value="cancelado">Cancelado</option>
                </select>
            </div>
            <div class="flex justify-end gap-3 mt-6">
                <button id="closePedidoModal" class="btn-secondary px-4 py-2 rounded-full text-sm">Cerrar</button>
                <button id="updateEstadoBtn" class="btn-primary px-4 py-2 rounded-full text-sm">Actualizar Estado</button>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ IMPORTANTE: Reemplaza "mitienda244-gif/catalogo-tienda" por el nombre de TU repositorio en GitHub
        const REPO_OWNER = "mitienda244-gif";
        const REPO_NAME = "catalogo-tienda";

        let currentUser = null;
        let productos = [];
        let pedidos = [];

        // Autenticación con Netlify Identity
        netlifyIdentity.init();
        netlifyIdentity.on('init', user => {
            if (!user) netlifyIdentity.open();
            else { currentUser = user; cargarProductos(); cargarPedidos(); }
        });
        netlifyIdentity.on('login', user => { currentUser = user; cargarProductos(); cargarPedidos(); });
        netlifyIdentity.on('logout', () => window.location.href = '/');
        document.getElementById('logoutBtn').addEventListener('click', () => netlifyIdentity.logout());

        async function getGitHubToken() {
            const res = await fetch('/.netlify/identity/git-gateway/token');
            const data = await res.json();
            return data.token;
        }

        async function cargarProductos() {
            try {
                const token = await getGitHubToken();
                const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/productos.json`, {
                    headers: { Authorization: `Bearer ${token}` }
                });
                const data = await res.json();
                const contenido = atob(data.content);
                const json = JSON.parse(contenido);
                productos = json.productos || [];
                renderizarProductos();
            } catch(e) { console.error(e); productos = []; renderizarProductos(); }
        }

        async function guardarProductos() {
            const token = await getGitHubToken();
            const contenido = btoa(JSON.stringify({ productos }, null, 2));
            const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/productos.json`, {
                headers: { Authorization: `Bearer ${token}` }
            });
            const data = await res.json();
            const sha = data.sha;
            await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/productos.json`, {
                method: 'PUT',
                headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: 'Actualización desde panel admin', content: contenido, sha })
            });
            alert('Productos guardados correctamente');
        }

        function renderizarProductos() {
            const container = document.getElementById('listaProductos');
            if (!productos.length) {
                container.innerHTML = '<p class="text-gray-400 text-center py-8">No hay productos. Crea uno nuevo.</p>';
                return;
            }
            container.innerHTML = productos.map((p, idx) => `
                <div class="bg-black/20 border border-white/5 rounded-xl p-3 flex justify-between items-center hover:border-white/10 transition-all">
                    <div>
                        <strong class="text-white">${p.titulo}</strong>
                        <span class="text-blue-400 ml-2">$${parseInt(p.precio).toLocaleString('es-AR')}</span>
                        <div class="text-xs text-gray-500 mt-0.5">ID: ${p.id} | ${p.categoria}</div>
                    </div>
                    <div>
                        <button onclick="editarProducto(${idx})" class="text-blue-400 hover:text-blue-300 mr-3"><i class="fa-regular fa-pen-to-square"></i></button>
                        <button onclick="eliminarProducto(${idx})" class="text-red-500 hover:text-red-400"><i class="fa-regular fa-trash-can"></i></button>
                    </div>
                </div>
            `).join('');
        }

        window.editarProducto = (idx) => {
            const p = productos[idx];
            document.getElementById('editProductId').value = idx;
            document.getElementById('prodCodigo').value = p.id;
            document.getElementById('prodTitulo').value = p.titulo;
            document.getElementById('prodPrecio').value = p.precio;
            document.getElementById('prodImagen').value = p.imagen;
            document.getElementById('prodTalles').value = p.talles;
            document.getElementById('prodColores').value = p.colores;
            document.getElementById('prodCategoria').value = p.categoria;
            document.getElementById('modalTitle').innerText = 'Editar Producto';
            document.getElementById('productoModal').classList.remove('hidden');
        };

        window.eliminarProducto = async (idx) => {
            if (confirm('¿Eliminar este producto?')) {
                productos.splice(idx, 1);
                await guardarProductos();
                cargarProductos();
            }
        };

        document.getElementById('nuevoProductoBtn').addEventListener('click', () => {
            document.getElementById('editProductId').value = '';
            document.getElementById('prodCodigo').value = '';
            document.getElementById('prodTitulo').value = '';
            document.getElementById('prodPrecio').value = '';
            document.getElementById('prodImagen').value = '';
            document.getElementById('prodTalles').value = '';
            document.getElementById('prodColores').value = '';
            document.getElementById('prodCategoria').value = 'urbano';
            document.getElementById('modalTitle').innerText = 'Nuevo Producto';
            document.getElementById('productoModal').classList.remove('hidden');
        });

        document.getElementById('saveProductBtn').addEventListener('click', async () => {
            const codigo = document.getElementById('prodCodigo').value.trim();
            const titulo = document.getElementById('prodTitulo').value.trim();
            const precio = document.getElementById('prodPrecio').value.trim();
            const imagen = document.getElementById('prodImagen').value.trim();
            const talles = document.getElementById('prodTalles').value.trim();
            const colores = document.getElementById('prodColores').value.trim();
            const categoria = document.getElementById('prodCategoria').value;
            if (!codigo || !titulo || !precio) {
                alert('Completá código, título y precio');
                return;
            }
            const nuevo = { id: codigo, titulo, precio, imagen, talles, colores, categoria };
            const editIdx = document.getElementById('editProductId').value;
            if (editIdx === '') productos.push(nuevo);
            else productos[parseInt(editIdx)] = nuevo;
            await guardarProductos();
            document.getElementById('productoModal').classList.add('hidden');
            cargarProductos();
        });

        document.getElementById('cancelModalBtn').addEventListener('click', () => {
            document.getElementById('productoModal').classList.add('hidden');
        });

        // Gestión de pedidos (localStorage)
        function cargarPedidos() {
            const stored = localStorage.getItem('pedidos_mi_tienda');
            pedidos = stored ? JSON.parse(stored) : [];
            renderizarPedidos();
        }
        function guardarPedidosLocal() {
            localStorage.setItem('pedidos_mi_tienda', JSON.stringify(pedidos));
        }
        function renderizarPedidos() {
            const container = document.getElementById('listaPedidos');
            if (!pedidos.length) {
                container.innerHTML = '<div class="text-center py-8 text-gray-400">No hay pedidos registrados.</div>';
                return;
            }
            container.innerHTML = pedidos.map((p, idx) => `
                <div class="bg-black/20 border border-white/5 rounded-xl p-4 hover:border-white/10 transition-all">
                    <div class="flex justify-between items-start flex-wrap gap-2">
                        <div>
                            <p class="font-medium text-white">${p.cliente.nombre}</p>
                            <p class="text-sm text-gray-400">${p.fecha}</p>
                            <p class="text-sm text-gray-400">${p.cliente.email} | ${p.cliente.telefono}</p>
                            <p class="text-sm mt-1 text-blue-400">Total: $${p.total.toLocaleString('es-AR')}</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="estado-${p.estado}">${p.estado.toUpperCase()}</span>
                            <button onclick="verPedido(${idx})" class="text-blue-400 hover:text-blue-300"><i class="fa-regular fa-eye"></i></button>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        window.verPedido = (idx) => {
            const p = pedidos[idx];
            const prodHtml = p.productos.map(prod => `
                <div class="border-b border-white/10 py-2 text-sm">
                    ${prod.cantidad} x ${prod.titulo} (Talle ${prod.talle}, ${prod.color}) - <span class="text-blue-400">$${prod.subtotal.toLocaleString('es-AR')}</span>
                </div>
            `).join('');
            document.getElementById('detallePedido').innerHTML = `
                <p><strong>Cliente:</strong> ${p.cliente.nombre}</p>
                <p><strong>Email:</strong> ${p.cliente.email}</p>
                <p><strong>Teléfono:</strong> ${p.cliente.telefono}</p>
                <p><strong>Fecha:</strong> ${p.fecha}</p>
                <p class="mt-2"><strong>Productos:</strong></p>
                <div class="pl-2">${prodHtml}</div>
                <p class="font-bold mt-2 pt-2 border-t border-white/10">Total: $${p.total.toLocaleString('es-AR')}</p>
            `;
            document.getElementById('estadoPedidoSelect').value = p.estado;
            window.pedidoIndexActual = idx;
            document.getElementById('pedidoModal').classList.remove('hidden');
        };
        document.getElementById('updateEstadoBtn').addEventListener('click', () => {
            const nuevo = document.getElementById('estadoPedidoSelect').value;
            const idx = window.pedidoIndexActual;
            if (idx !== undefined) {
                pedidos[idx].estado = nuevo;
                guardarPedidosLocal();
                renderizarPedidos();
                document.getElementById('pedidoModal').classList.add('hidden');
            }
        });
        document.getElementById('closePedidoModal').addEventListener('click', () => {
            document.getElementById('pedidoModal').classList.add('hidden');
        });

        // Tabs
        document.getElementById('tabProductos').addEventListener('click', () => {
            document.getElementById('productosPanel').classList.remove('hidden');
            document.getElementById('pedidosPanel').classList.add('hidden');
            document.getElementById('tabProductos').classList.add('active');
            document.getElementById('tabPedidos').classList.remove('active');
        });
        document.getElementById('tabPedidos').addEventListener('click', () => {
            document.getElementById('productosPanel').classList.add('hidden');
            document.getElementById('pedidosPanel').classList.remove('hidden');
            document.getElementById('tabPedidos').classList.add('active');
            document.getElementById('tabProductos').classList.remove('active');
            cargarPedidos();
        });
    </script>
</body>
</html>
