backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

# Esto traduce la interfaz al español
locale: 'es'

collections:
  - name: "inventario"
    label: "Gestión de Inventario"
    files:
      - name: "productos"
        label: "Lista de Productos"
        file: "productos.json"
        fields:
          - name: "productos"
            label: "Lista de Productos"
            widget: "list"
            fields:
              - { label: "Código", name: "id", widget: "string" }
              - { label: "Nombre", name: "titulo", widget: "string" }
              - { label: "Precio", name: "precio", widget: "number" }
              - { label: "Imagen", name: "imagen", widget: "image" }
              - { label: "Talles", name: "talles", widget: "string" }
              - { label: "Colores", name: "colores", widget: "string" }

